learning_objectives:
  - id: OBJ-000101
    type: learning_objective
    schema_version: 1.0.0
    status: draft
    title: Identify noun gender and number
    description: >-
      Distinguish masculine, feminine, and neuter gender and singular, plural,
      and the existence of the dual as grammatical categories.
    skill_ids: [SKL-000101]
    mastery_threshold: 0.90
    origin: source-derived
  - id: OBJ-000102
    type: learning_objective
    schema_version: 1.0.0
    status: draft
    title: Identify the five Greek cases
    description: >-
      Name and distinguish nominative, genitive, dative, accusative, and vocative.
    skill_ids: [SKL-000102]
    mastery_threshold: 0.90
    origin: source-derived
  - id: OBJ-000103
    type: learning_objective
    schema_version: 1.0.0
    status: draft
    title: Explain case function through inflection
    description: >-
      Explain how noun endings mark grammatical relations that English often
      expresses through word order or prepositions.
    skill_ids: [SKL-000103]
    mastery_threshold: 0.90
    origin: source-derived
  - id: OBJ-000104
    type: learning_objective
    schema_version: 1.0.0
    status: draft
    title: Decline first-declension feminine nouns
    description: >-
      Produce and identify the singular and plural forms of first-declension
      feminine nouns in -η and -ᾱ.
    skill_ids: [SKL-000104]
    mastery_threshold: 0.90
    origin: source-derived
  - id: OBJ-000105
    type: learning_objective
    schema_version: 1.0.0
    status: draft
    title: Apply persistent accent in first-declension forms
    description: >-
      Preserve or adjust noun accent according to the accent rules and the
      special first-declension genitive plural ending.
    skill_ids: [SKL-000105]
    mastery_threshold: 0.85
    origin: source-derived
  - id: OBJ-000106
    type: learning_objective
    schema_version: 1.0.0
    status: draft
    title: Decline second-declension masculine and feminine nouns
    description: >-
      Produce and identify second-declension masculine and feminine forms.
    skill_ids: [SKL-000106]
    mastery_threshold: 0.90
    origin: source-derived
  - id: OBJ-000107
    type: learning_objective
    schema_version: 1.0.0
    status: draft
    title: Decline second-declension neuter nouns
    description: >-
      Produce and identify second-declension neuter forms and apply the rule
      that nominative, accusative, and vocative are identical.
    skill_ids: [SKL-000107]
    mastery_threshold: 0.90
    origin: source-derived
  - id: OBJ-000108
    type: learning_objective
    schema_version: 1.0.0
    status: draft
    title: Decline the Greek definite article
    description: >-
      Identify and produce the article across gender, number, and case.
    skill_ids: [SKL-000108]
    mastery_threshold: 0.95
    origin: source-derived
  - id: OBJ-000109
    type: learning_objective
    schema_version: 1.0.0
    status: draft
    title: Recognize article-noun agreement and attributive position
    description: >-
      Identify agreement in gender, number, and case and recognize the principal
      patterns of attributive position introduced in the unit.
    skill_ids: [SKL-000109]
    mastery_threshold: 0.90
    origin: source-derived
  - id: OBJ-000110
    type: learning_objective
    schema_version: 1.0.0
    status: draft
    title: Interpret Greek word order through inflection and emphasis
    description: >-
      Use inflection to identify grammatical relations and treat word order as
      a potential marker of emphasis rather than as the sole marker of syntax.
    skill_ids: [SKL-000110]
    mastery_threshold: 0.85
    origin: source-derived

